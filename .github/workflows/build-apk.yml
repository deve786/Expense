name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q spendly-expo-app.zip

      - name: Install dependencies
        run: cd expense-tracker && npm install

      - name: Generate Android project
        run: cd expense-tracker && npx expo prebuild --platform android --no-install

      - name: Build APK
        run: cd expense-tracker/android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spendly-apk
          path: expense-tracker/android/app/build/outputs/apk/release/*.apk
